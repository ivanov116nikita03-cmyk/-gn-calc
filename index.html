<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1BA8B0">
<title>GN Калькулятор</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22GN%20Калькулятор%22,%22short_name%22:%22GN%20Calc%22,%22display%22:%22standalone%22,%22background_color%22:%22%231BA8B0%22,%22theme_color%22:%22%231BA8B0%22,%22icons%22:[]}">
<style>
/* ════════════════════════════════════════════════════════════════
   GOOD NIGHT — фирменная гамма (бирюза + золото + белый)
   Цены редактируются в JS-блоке PRICES внизу файла.
   ════════════════════════════════════════════════════════════════ */
:root {
  --teal:      #1BA8B0;
  --teal-dk:   #15858C;
  --teal-deep: #0E6B71;
  --gold:      #F5A623;
  --gold-lt:   #FFC04D;
  --ink:       #0a3d40;
  --white:     #ffffff;
  --soft:      rgba(255,255,255,0.14);
  --soft-2:    rgba(255,255,255,0.08);
  --line:      rgba(255,255,255,0.18);
  --radius:    18px;
  --shadow:    0 8px 30px rgba(0,0,0,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dk) 55%, var(--teal-deep) 100%);
  background-attachment: fixed;
  color: var(--white); min-height: 100vh; padding-bottom: 210px;
  font-size: 16px; line-height: 1.4; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
  background-size: 26px 26px; opacity: 0.5;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 0; position: relative; z-index: 1; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.logo { display: flex; flex-direction: column; line-height: 1; }
.logo .brand { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: var(--white); text-transform: uppercase; }
.logo .brand b { color: var(--gold); }
.logo .sub { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-top: 4px; }
.city-pill {
  background: var(--gold); color: var(--ink); font-weight: 800; font-size: 13px;
  padding: 8px 14px; border-radius: 30px; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(245,166,35,0.4);
}
.seg {
  display: flex; gap: 6px; margin-bottom: 22px; background: var(--soft-2);
  padding: 6px; border-radius: var(--radius); border: 1px solid var(--line);
}
.seg button {
  flex: 1; padding: 15px 8px; border: none; border-radius: 13px; background: transparent;
  color: rgba(255,255,255,0.65); font-size: 16px; font-weight: 800; cursor: pointer;
  transition: all 0.25s cubic-bezier(.4,0,.2,1); display: flex; align-items: center; justify-content: center; gap: 7px;
}
.seg button.on { background: var(--white); color: var(--teal-dk); box-shadow: 0 4px 16px rgba(0,0,0,0.15); transform: translateY(-1px); }
.seg button svg { width: 19px; height: 19px; }
.card {
  background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; backdrop-filter: blur(8px);
  animation: rise 0.4s cubic-bezier(.2,.7,.3,1) backwards;
}
@keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: none; } }
.card:nth-child(2){ animation-delay:.03s } .card:nth-child(3){ animation-delay:.06s }
.card:nth-child(4){ animation-delay:.09s } .card:nth-child(5){ animation-delay:.12s }
.section-label {
  font-size: 12px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: 700;
}
.section-label svg { width: 16px; height: 16px; opacity: 0.85; }
.stepper { display: flex; align-items: stretch; background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.stepper button {
  width: 64px; border: none; background: #f0f7f7; color: var(--teal-dk); font-size: 30px; font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; user-select: none;
}
.stepper button:active { background: var(--gold); color: var(--white); }
.stepper .val { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; }
.stepper .val input {
  width: 100%; text-align: center; border: none; outline: none; font-size: 32px; font-weight: 900;
  color: var(--ink); background: transparent; -moz-appearance: textfield;
}
.stepper .val input::-webkit-outer-spin-button, .stepper .val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .val small { font-size: 11px; color: #6b8a8c; font-weight: 600; }
.hint { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
.hint svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; }
.chips { display: flex; flex-wrap: wrap; gap: 9px; }
.chip {
  padding: 13px 20px; border-radius: 12px; background: var(--soft-2); border: 1.5px solid var(--line);
  color: var(--white); font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s;
  flex: 1; min-width: 70px; text-align: center;
}
.chip.on { background: var(--gold); color: var(--ink); border-color: var(--gold); transform: scale(1.04); box-shadow: 0 6px 18px rgba(245,166,35,0.4); }
.addon {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 9px;
  background: var(--soft-2); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; transition: all 0.2s;
}
.addon.on { border-color: var(--gold); background: var(--soft); }
.addon .ico {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; background: var(--soft);
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.addon.on .ico { background: var(--gold); }
.addon .ico svg { width: 21px; height: 21px; stroke: var(--white); fill: none; }
.addon.on .ico svg { stroke: var(--ink); }
.addon .info { flex: 1; }
.addon .info b { font-size: 15px; font-weight: 700; display: block; }
.addon .info small { font-size: 12px; color: rgba(255,255,255,0.7); }
.addon .toggle {
  width: 50px; height: 30px; border-radius: 15px; background: var(--soft); position: relative;
  flex-shrink: 0; transition: background 0.25s; border: 1px solid var(--line);
}
.addon.on .toggle { background: var(--gold); border-color: var(--gold); }
.addon .toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.addon.on .toggle::after { transform: translateX(20px); }
.addon .qty { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.addon .qty button { width: 34px; height: 34px; border-radius: 9px; border: none; background: var(--white); color: var(--teal-dk); font-size: 20px; font-weight: 600; cursor: pointer; }
.addon .qty span { min-width: 22px; text-align: center; font-weight: 800; font-size: 17px; }
.total {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--white);
  border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
  padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
}
.total-inner { max-width: 560px; margin: 0 auto; }
.total-rows { margin-bottom: 12px; max-height: 96px; overflow-y: auto; }
.total-row { display: flex; justify-content: space-between; font-size: 13px; color: #6b8a8c; padding: 3px 0; font-weight: 500; }
.total-row.rs { color: var(--gold); font-weight: 700; }
.total-main { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 14px; border-top: 2px dashed #e0ebeb; }
.total-main .label { font-size: 13px; color: #6b8a8c; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.total-main .sum { font-size: 38px; font-weight: 900; letter-spacing: -1.5px; color: var(--ink); transition: transform 0.2s; }
.total-main .sum.pulse { animation: pulse 0.35s ease; }
@keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.07)} 100%{transform:scale(1)} }
.total-main .sum span { font-size: 20px; color: var(--teal); font-weight: 700; }
.per-person { font-size: 14px; color: var(--teal-dk); margin-top: 2px; text-align: right; font-weight: 700; }
.rs-toggle { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 13px; color: #6b8a8c; font-weight: 600; cursor: pointer; width: fit-content; }
.rs-toggle .toggle { width: 44px; height: 26px; border-radius: 13px; background: #d5e3e3; position: relative; transition: background 0.2s; }
.rs-toggle.on .toggle { background: var(--gold); }
.rs-toggle .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.rs-toggle.on .toggle::after { transform: translateX(18px); }
.total { cursor: pointer; transition: transform 0.12s; }
.total:active { transform: scale(0.995); }
.tap-hint {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  margin-top: 14px; padding-top: 13px; border-top: 1px solid #eef4f4;
  font-size: 13px; font-weight: 700; color: var(--teal);
}
.tap-hint svg { width: 17px; height: 17px; animation: tapPulse 1.8s ease-in-out infinite; }
@keyframes tapPulse { 0%,100%{ transform: translateY(0); opacity:0.7 } 50%{ transform: translateY(-3px); opacity:1 } }

/* ── Экран чека ── */
.receipt {
  position: fixed; inset: 0; z-index: 200;
  background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dk) 55%, var(--teal-deep) 100%);
  display: none; overflow-y: auto;
}
.receipt::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
  background-size: 26px 26px; opacity: 0.5;
}
.receipt.show { display: block; animation: fade 0.25s; }
.receipt-inner { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; position: relative; z-index: 1; }
.receipt-back {
  background: none; border: none; color: var(--white); font-size: 15px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; gap: 7px; padding: 10px 4px; margin-bottom: 8px;
}
.receipt-back svg { width: 20px; height: 20px; }
.receipt-card {
  background: var(--white); border-radius: 24px; padding: 30px 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: var(--ink);
}
.receipt-logo { text-align: center; margin-bottom: 20px; }
.receipt-logo .brand { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: var(--ink); text-transform: uppercase; display: block; }
.receipt-logo .brand b { color: var(--gold); }
.receipt-logo .sub { font-size: 9px; letter-spacing: 3px; color: #8aa3a4; text-transform: uppercase; }
.receipt-badge {
  display: block; text-align: center; background: var(--teal); color: var(--white);
  font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  padding: 8px; border-radius: 30px; margin-bottom: 22px;
}
.receipt-params { display: flex; justify-content: space-around; margin-bottom: 22px; gap: 8px; }
.rp-item { text-align: center; flex: 1; }
.rp-item .rp-val { font-size: 26px; font-weight: 900; color: var(--ink); line-height: 1; }
.rp-item .rp-lbl { font-size: 11px; color: #8aa3a4; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; }
.rp-sep { width: 1px; background: #e0ebeb; }
.receipt-includes { background: #f0f7f7; border-radius: 16px; padding: 18px 20px; margin-bottom: 22px; }
.ri-title { font-size: 12px; font-weight: 800; color: var(--teal-dk); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.ri-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.ri-item svg { width: 18px; height: 18px; stroke: var(--gold); fill: none; flex-shrink: 0; }
/* строки расчёта внутри чека — тот же вид, что в нижней панели, чуть просторнее */
.receipt-includes .total-row { font-size: 14px; padding: 5px 0; }
.receipt-includes .total-row + .total-row { border-top: 1px solid #e2eded; }
.receipt-total { text-align: center; padding: 8px 0 4px; }
.rt-label { display: block; font-size: 12px; color: #8aa3a4; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
.rt-sum { display: block; font-size: 48px; font-weight: 900; color: var(--ink); letter-spacing: -2px; line-height: 1.1; margin: 4px 0; }
.rt-pp { display: block; font-size: 15px; color: var(--teal-dk); font-weight: 700; }
.receipt-foot {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 22px; padding-top: 18px; border-top: 2px dashed #e0ebeb;
  font-size: 12px; color: #8aa3a4; font-weight: 600;
}
.receipt-foot .dot { opacity: 0.5; }
.receipt-foot svg { stroke: var(--gold); }

.hidden { display: none !important; }
.bday-toggle {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding: 12px 14px; background: var(--soft-2);
  border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; transition: all 0.2s;
}
.bday-toggle.on { border-color: var(--gold); background: var(--soft); }
.bday-info { display: flex; align-items: center; gap: 11px; }
.bday-info svg { width: 22px; height: 22px; stroke: var(--gold); flex-shrink: 0; }
.bday-info b { font-size: 15px; font-weight: 700; display: block; }
.bday-info small { font-size: 12px; color: rgba(255,255,255,0.7); }
.bday-toggle .toggle {
  width: 50px; height: 30px; border-radius: 15px; background: var(--soft);
  position: relative; flex-shrink: 0; transition: background 0.25s; border: 1px solid var(--line);
}
.bday-toggle.on .toggle { background: var(--gold); border-color: var(--gold); }
.bday-toggle .toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #fff; transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.bday-toggle.on .toggle::after { transform: translateX(20px); }
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(10,61,64,0.6); backdrop-filter: blur(4px); display: none; align-items: flex-end; }
.modal.show { display: flex; animation: fade 0.2s; }
@keyframes fade { from {opacity:0} to {opacity:1} }
.modal-sheet { background: var(--white); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 22px 16px calc(22px + env(safe-area-inset-bottom)); animation: slideup 0.3s cubic-bezier(.2,.7,.3,1); }
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.modal-sheet h3 { color: var(--ink); font-size: 18px; margin-bottom: 16px; }
.city-opt { padding: 16px; border-radius: 13px; background: #f0f7f7; color: var(--ink); font-weight: 700; font-size: 16px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.city-opt.on { background: var(--teal); color: var(--white); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">
      <span class="brand">GOOD <b>NIGHT</b></span>
      <span class="sub">Новый формат отдыха</span>
    </div>
    <button class="city-pill" onclick="openCity()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="cityName">Москва</span>
    </button>
  </div>
  <div class="seg">
    <button id="segStudio" class="on" onclick="setMode('studio')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
      Студия
    </button>
    <button id="segVyezd" onclick="setMode('vyezd')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Выезд
    </button>
  </div>
  <div class="card">
    <span class="section-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Гостей
    </span>
    <div class="stepper">
      <button onclick="bump('guests',-1)">−</button>
      <div class="val">
        <input type="number" id="guestsInput" value="10" inputmode="numeric" onchange="setNum('guests',this.value)" onfocus="this.select()">
        <small>человек</small>
      </div>
      <button onclick="bump('guests',1)">+</button>
    </div>
    <div class="hint" id="minNote"></div>
    <div class="bday-toggle hidden" id="bdayToggle" onclick="toggleBday()">
      <div class="bday-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-8H4v8M4 13V9a2 2 0 012-2h12a2 2 0 012 2v4M12 7V3M9 3h6"/><circle cx="12" cy="5" r="1"/></svg>
        <div><b>Есть именинник?</b><small id="bdayNote">Бесплатно от 11 чел</small></div>
      </div>
      <div class="toggle"></div>
    </div>
  </div>
  <div class="card">
    <span class="section-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Длительность
    </span>
    <div class="chips" id="durChips"></div>
  </div>
  <div class="card hidden" id="vyezdSection">
    <span class="section-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.5-3V4L9 7m0 13l6-3m-6 3V7m6 10l5.5 3V7L15 4m0 13V4m-6 3l6-3"/></svg>
      Расстояние от МКАД
    </span>
    <div class="stepper">
      <button onclick="bump('km',-5)">−</button>
      <div class="val">
        <input type="number" id="kmInput" value="0" inputmode="numeric" onchange="setNum('km',this.value)" onfocus="this.select()">
        <small>км от МКАД</small>
      </div>
      <button onclick="bump('km',5)">+</button>
    </div>
    <div class="hint" id="kmWarn"></div>
  </div>
  <div class="card">
    <span class="section-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg>
      Дополнительно
    </span>
    <div id="addons"></div>
  </div>
</div>
<div class="total" id="totalPanel" onclick="openReceipt()">
  <div class="total-inner">
    <div class="total-rows" id="breakdown"></div>
    <div class="total-main">
      <div>
        <div class="label">Итого</div>
        <div class="rs-toggle" id="rsToggle" onclick="event.stopPropagation(); toggleRS()">
          <div class="toggle"></div><span>Оплата по РС (+10%)</span>
        </div>
      </div>
      <div style="text-align:right">
        <div class="sum" id="sumVal">0 <span>₽</span></div>
        <div class="per-person" id="perPerson"></div>
      </div>
    </div>
  </div>
</div>

<!-- Экран чека для клиента -->
<div class="receipt" id="receipt">
  <div class="receipt-inner">
    <button class="receipt-back" onclick="closeReceipt()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      К расчёту
    </button>
    <div class="receipt-card" id="receiptCard">
      <div class="receipt-logo">
        <span class="brand">GOOD <b>NIGHT</b></span>
        <span class="sub">Новый формат отдыха</span>
      </div>
      <div class="receipt-badge" id="receiptMode">Игра в студии</div>
      <div class="receipt-params" id="receiptParams"></div>
      <div class="receipt-includes">
        <div class="ri-title">Детали расчёта</div>
        <div id="receiptIncludes"></div>
      </div>
      <div class="receipt-total">
        <span class="rt-label">Стоимость</span>
        <span class="rt-sum" id="receiptSum">0 ₽</span>
        <span class="rt-pp" id="receiptPP"></span>
      </div>
      <div class="receipt-foot">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="receiptCity">Москва</span>
        <span class="dot">·</span>
        <span>goodnight.show</span>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="cityModal" onclick="closeCity(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <h3>Выбери город</h3>
    <div id="cityList"></div>
  </div>
</div>
<script>
/* ════════════════════════════════════════════════════════════════
   ПРАЙС ГОРОДОВ — РЕДАКТИРУЙ ЗДЕСЬ
   Добавить город: скопируй блок msk, переименуй ключ, поправь цифры.
   ════════════════════════════════════════════════════════════════ */
const PRICES = {
  msk: {
    name: "Москва",
    studio: {
      perPerson: { "1ч": 1800, "1.5ч": 2200, "2ч": 2800, "2.5ч": 3000, "3ч": 3200 },
      minGuests: 10,
      minPay: { "1ч": 18000, "1.5ч": 22000, "2ч": 28000, "2.5ч": 30000, "3ч": 32000 },
      durations: ["1ч", "1.5ч", "2ч", "2.5ч", "3ч"],
      birthdayFreeFrom: 10,   // именинник бесплатно от 10 человек (платят на 1 меньше)
    },
    vyezd: {
      tiers: {
        "1ч":   { 10:28000, 15:33000, 20:39000, 25:44000, 30:49000, 35:54000, 40:59000 },
        "1.5ч": { 10:32000, 15:37000, 20:43000, 25:48000, 30:53000, 35:58000, 40:63000 },
        "2ч":   { 10:37000, 15:42000, 20:48000, 25:54000, 30:58000, 35:63000, 40:68000 },
        "2.5ч": { 10:42000, 15:47000, 20:53000, 25:59000, 30:63000, 35:68000, 40:73000 },
        "3ч":   { 10:47000, 15:52000, 20:58000, 25:64000, 30:68000, 35:73000, 40:78000 },
      },
      durations: ["1ч", "1.5ч", "2ч", "2.5ч", "3ч"],
      logistics: { freeKm: 20, baseCost: 5000, stepKm: 10, stepCost: 3000 },
      // свыше 40 чел: за каждые overflowStep гостей +overflowCost (округление вверх)
      overflow: { fromGuests: 40, step: 5, cost: 5000 },
    },
    addons: [
      { id:"dj",      name:"Диджей",         note:"караоке / дискотека · за час", price:9000,  perHour:true,  icon:"music" },
      { id:"host",    name:"Ведение",     note:"персональный сценарий · за час",  price:14000, perHour:true,  icon:"mic"   },
      { id:"rent",    name:"Аренда студии",  note:"фуршетная зона · за час",      price:6000,  perHour:true,  icon:"home"  },
      { id:"person",  name:"Персонализация", note:"раунд под клиента · за раунд", price:5000,  perHour:true,  icon:"star"  },
    ],
  },
  // kazan: { name:"Казань", studio:{...}, vyezd:{...}, addons:[...] },
};
/* ════════════════════════════════════════════════════════════════
   КОНЕЦ РЕДАКТИРУЕМОГО БЛОКА. Ниже логика — не трогай.
   ════════════════════════════════════════════════════════════════ */
const ICONS = {
  music: '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  mic:   '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>',
  home:  '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  star:  '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.3 3.2L7 14.2 2 9.4l7-.9z"/></svg>',
};
const state = { cityKey:"msk", mode:"studio", guests:10, dur:"1ч", km:0, rs:false, birthday:false, addons:{} };
function city() { return PRICES[state.cityKey]; }
function init(){ resetForCity(); render(); }
function resetForCity(){
  const c=city();
  document.getElementById("cityName").textContent=c.name;
  const durs=state.mode==="studio"?c.studio.durations:c.vyezd.durations;
  if(!durs.includes(state.dur)) state.dur=durs[0];
  state.addons={};
}
function openCity(){
  document.getElementById("cityList").innerHTML=Object.keys(PRICES).map(k=>
    `<div class="city-opt ${k===state.cityKey?'on':''}" onclick="pickCity('${k}')">${PRICES[k].name} ${k===state.cityKey?'✓':''}</div>`).join("");
  document.getElementById("cityModal").classList.add("show");
}
function closeCity(e){ if(e.target.id==="cityModal") document.getElementById("cityModal").classList.remove("show"); }
function pickCity(k){ state.cityKey=k; resetForCity(); render(); document.getElementById("cityModal").classList.remove("show"); }
function setMode(m){
  state.mode=m;
  document.getElementById("segStudio").classList.toggle("on",m==="studio");
  document.getElementById("segVyezd").classList.toggle("on",m==="vyezd");
  document.getElementById("vyezdSection").classList.toggle("hidden",m!=="vyezd");
  const durs=m==="studio"?city().studio.durations:city().vyezd.durations;
  if(!durs.includes(state.dur)) state.dur=durs[0];
  render();
}
function bump(f,d){ if(f==="guests")state.guests=Math.max(1,state.guests+d); if(f==="km")state.km=Math.max(0,state.km+d); render(); }
function setNum(f,v){ let n=parseInt(String(v).replace(/\D/g,''))||0; if(f==="guests")state.guests=Math.max(1,n); if(f==="km")state.km=Math.max(0,n); render(); }
function setDur(d){ state.dur=d; render(); }
function toggleAddon(id){ if(state.addons[id])delete state.addons[id]; else state.addons[id]=1; render(); }
function addonQty(id,d,ev){ ev.stopPropagation(); const q=(state.addons[id]||0)+d; if(q<=0)delete state.addons[id]; else state.addons[id]=q; render(); }
function toggleRS(){ state.rs=!state.rs; render(); }
function toggleBday(){ state.birthday=!state.birthday; render(); }
// допы, которые увеличивают длительность мероприятия (часы), кроме персонализации
const TIME_ADDONS = ["dj","host","rent"];
// число часов из строки длительности игры: "1.5ч" → 1.5
function durHours(d){ return parseFloat(String(d).replace(",",".").replace(/[^\d.]/g,""))||0; }
// общее время мероприятия = игра + часы допов (dj/host/rent)
function totalHours(){
  let h=durHours(state.dur);
  for(const id of TIME_ADDONS){ h+=(state.addons[id]||0); }
  return h;
}
// слово "час" по числу: 1 → час, 2 → часа, 5 → часов (дробные → "часа")
function hoursWord(h){
  if(h%1!==0) return "часа";
  const n=h%100, n1=h%10;
  if(n>=11&&n<=14) return "часов";
  if(n1===1) return "час";
  if(n1>=2&&n1<=4) return "часа";
  return "часов";
}
function calc(){
  const c=city(); let base=0, lines=[];
  if(state.mode==="studio"){
    const pp=c.studio.perPerson[state.dur]||0;
    // именинник бесплатно от N человек — платят (гости - 1)
    let payGuests=state.guests;
    const freeFrom=c.studio.birthdayFreeFrom||999;
    if(state.birthday && state.guests>=freeFrom){ payGuests=state.guests-1; }
    let sum=pp*payGuests;
    if(state.guests<c.studio.minGuests && sum<c.studio.minPay[state.dur]){
      sum=c.studio.minPay[state.dur];
      lines.push([`Минимальная оплата (${c.studio.minGuests} чел)`,sum]);
    } else {
      const lbl = (state.birthday && state.guests>=freeFrom)
        ? `${pp.toLocaleString('ru')} ₽ × ${payGuests} чел (именинник free)`
        : `${pp.toLocaleString('ru')} ₽ × ${state.guests} чел`;
      lines.push([lbl,sum]);
    }
    base=sum;
  } else {
    const tier=c.vyezd.tiers[state.dur]||{}; const caps=Object.keys(tier).map(Number).sort((a,b)=>a-b);
    const maxCap=caps[caps.length-1];
    let price=0, cap=null;
    for(const cp of caps){ if(state.guests<=cp){price=tier[cp];cap=cp;break;} }
    if(price===0){
      // свыше максимума — макс тариф + доплата, но в чеке одна строка с итоговой ценой за N чел
      cap=maxCap; price=tier[maxCap];
      let vyezdTotal=price;
      const ov=c.vyezd.overflow;
      if(ov && state.guests>ov.fromGuests){
        const steps=Math.ceil((state.guests-ov.fromGuests)/ov.step);
        vyezdTotal+=steps*ov.cost;
      }
      lines.push([`Выезд ${state.dur} (${state.guests} чел)`, vyezdTotal]);
      base=vyezdTotal;
    } else {
      lines.push([`Выезд ${state.dur} (до ${cap} чел)`,price]);
      base=price;
    }
    const lg=c.vyezd.logistics;
    if(state.km>lg.freeKm){ const steps=Math.ceil((state.km-lg.freeKm)/lg.stepKm); const lc=lg.baseCost+steps*lg.stepCost; lines.push([`Логистика (${state.km} км)`,lc]); base+=lc; }
    else if(state.km>0){ lines.push([`Логистика (до ${lg.freeKm} км)`,lg.baseCost]); base+=lg.baseCost; }
  }
  for(const a of c.addons){ const qty=state.addons[a.id]; if(!qty)continue; const cost=a.price*qty; lines.push([`${a.name} ×${qty}`,cost]); base+=cost; }
  let total=base, rsAmount=0;
  if(state.rs){ rsAmount=Math.round(base*0.1); total=base+rsAmount; }
  return { base, total, rsAmount, lines };
}
let lastSum=0;
function render(){
  const c=city();
  document.getElementById("guestsInput").value=state.guests;
  document.getElementById("kmInput").value=state.km;
  const minNote=document.getElementById("minNote");
  minNote.innerHTML=state.mode==="studio"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Минимум ${c.studio.minGuests} чел или оплата как за ${c.studio.minGuests}` : "";
  // тумблер именинника — только студия
  const bday=document.getElementById("bdayToggle");
  bday.classList.toggle("hidden", state.mode!=="studio");
  bday.classList.toggle("on", state.birthday);
  if(state.mode==="studio"){
    document.getElementById("bdayNote").textContent=`Бесплатно от ${c.studio.birthdayFreeFrom} чел`;
  }
  const durs=state.mode==="studio"?c.studio.durations:c.vyezd.durations;
  document.getElementById("durChips").innerHTML=durs.map(d=>`<button class="chip ${d===state.dur?'on':''}" onclick="setDur('${d}')">${d}</button>`).join("");
  const kmWarn=document.getElementById("kmWarn");
  if(state.mode==="vyezd"){
    const lg=c.vyezd.logistics;
    kmWarn.innerHTML=state.km>lg.freeKm
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Свыше ${lg.freeKm} км: +${lg.stepCost.toLocaleString('ru')} ₽ за каждые ${lg.stepKm} км`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> До ${lg.freeKm} км — ${lg.baseCost.toLocaleString('ru')} ₽`;
  }
  document.getElementById("addons").innerHTML=c.addons.map(a=>{
    const on=!!state.addons[a.id]; const qty=state.addons[a.id]||0;
    const qtyBlock=on&&a.perHour?`<div class="qty"><button onclick="addonQty('${a.id}',-1,event)">−</button><span>${qty}</span><button onclick="addonQty('${a.id}',1,event)">+</button></div>`:"";
    return `<div class="addon ${on?'on':''}" onclick="toggleAddon('${a.id}')"><div class="ico">${ICONS[a.icon]||''}</div><div class="info"><b>${a.name}</b><small>${a.note} · ${a.price.toLocaleString('ru')} ₽</small></div>${qtyBlock}<div class="toggle"></div></div>`;
  }).join("");
  const r=calc();
  document.getElementById("breakdown").innerHTML=r.lines.map(([l,v])=>`<div class="total-row"><span>${l}</span><span>${v.toLocaleString('ru')} ₽</span></div>`).join("")+(r.rsAmount?`<div class="total-row rs"><span>+10% по РС</span><span>${r.rsAmount.toLocaleString('ru')} ₽</span></div>`:"");
  const sumEl=document.getElementById("sumVal");
  sumEl.innerHTML=`${r.total.toLocaleString('ru')} <span>₽</span>`;
  if(r.total!==lastSum){ sumEl.classList.remove("pulse"); void sumEl.offsetWidth; sumEl.classList.add("pulse"); lastSum=r.total; }
  document.getElementById("rsToggle").classList.toggle("on",state.rs);
  const pp=document.getElementById("perPerson");
  pp.textContent=(state.mode==="studio"&&state.guests>0)?`${Math.round(r.total/state.guests).toLocaleString('ru')} ₽ / чел`:"";
}
function openReceipt(){
  const c=city(); const r=calc();
  document.getElementById("receiptMode").textContent = state.mode==="studio" ? "Игра в студии" : "Выездная шоу-игра";
  document.getElementById("receiptCity").textContent = c.name;

  // Параметры: гости, общее время мероприятия, (км для выезда)
  const th=totalHours();
  let params = [
    `<div class="rp-item"><div class="rp-val">${state.guests}</div><div class="rp-lbl">гостей</div></div>`,
    `<div class="rp-sep"></div>`,
    `<div class="rp-item"><div class="rp-val">${th.toLocaleString('ru')}</div><div class="rp-lbl">${hoursWord(th)} меропр.</div></div>`,
  ];
  if(state.mode==="vyezd" && state.km>0){
    params.push(`<div class="rp-sep"></div>`);
    params.push(`<div class="rp-item"><div class="rp-val">${state.km}</div><div class="rp-lbl">км от МКАД</div></div>`);
  }
  document.getElementById("receiptParams").innerHTML = params.join("");

  // Что входит — строки расчёта один в один как в нижней панели (название + цена)
  document.getElementById("receiptIncludes").innerHTML =
    r.lines.map(([l,v])=>`<div class="total-row"><span>${l}</span><span>${v.toLocaleString('ru')} ₽</span></div>`).join("")
    + (r.rsAmount?`<div class="total-row rs"><span>+10% по РС</span><span>${r.rsAmount.toLocaleString('ru')} ₽</span></div>`:"");

  // Итог
  document.getElementById("receiptSum").textContent = `${r.total.toLocaleString('ru')} ₽`;
  const pp=document.getElementById("receiptPP");
  if(state.mode==="studio" && state.guests>0){
    pp.textContent = `${Math.round(r.total/state.guests).toLocaleString('ru')} ₽ за человека`;
  } else { pp.textContent = state.rs ? "оплата по расчётному счёту" : ""; }

  document.getElementById("receipt").classList.add("show");
}
function closeReceipt(){ document.getElementById("receipt").classList.remove("show"); }

init();
if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
</script>
</body>
</html>
